sources:
  carbon-adk.dev.game: "git+https://github.com/mpuls-midknightdev/carbon-adk.dev.game"
  carbon-adk.dev: "git+https://github.com/mpuls-midknightdev/carbon-adk.dev"
  carbon-adk: "git+https://github.com/mpuls-midknightdev/carbon-adk"
  carbon-spine: "git+https://github.com/mpuls-midknightdev/carbon-spine"
features:
